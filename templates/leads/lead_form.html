{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block title %}Add Lead{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h4>Add Lead</h4>
        <form method="post">
            {% csrf_token %}
            {% bootstrap_form form %}
            <button type="submit" class="btn btn-primary">Create Lead</button>
        </form>
    </div>
</div>
{% endblock %}
